apiVersion: v1
kind: Service
metadata:
  name: {{ include "kabisa-wyze-bridge.fullname" . }}-service
  labels:
    {{- include "kabisa-wyze-bridge.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "kabisa-wyze-bridge.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
    {{- with .Values.service.extraPorts }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
