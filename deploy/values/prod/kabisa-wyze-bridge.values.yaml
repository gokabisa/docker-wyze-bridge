replicaCount: 1

image:
  repository: ghcr.io/gokabisa/wyze-bridge
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets:
  - name: regcred

credentialsSecret: wyze-bridge-credentials
webAuthSecret: wyze-bridge-webauth

service:
  type: ClusterIP
  port: 5000
  targetPort: 5000

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 1Gi

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 2
    memory: 2Gi

env:
  WB_AUTH: "True"
  FLASK_RUN_PORT: "5000"
  LLHLS: "false"
  REQUESTS_CA_BUNDLE: "/etc/ssl/certs/ca-certificates.crt"
  SSL_CERT_FILE: "/etc/ssl/certs/ca-certificates.crt"
